# Cấu hình ví dụ cho Vietnamese Writing Skill
# Copy file này thành config.yaml rồi sửa.

# Endpoint LLM (tương thích OpenAI)
base_url: "https://api.openai.com/v1"
api_key: "sk-your-key-here"
model: "gpt-4o"

# Tham số sinh
max_tokens: 4000
temperature: 0.7

